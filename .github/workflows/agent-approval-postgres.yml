name: Agent approval PostgreSQL regression
on:
  pull_request:
  push:
    branches: [main, claude/agentic-os-build-dp93ao]
permissions:
  contents: read
jobs:
  approvals:
    name: Approval consumption, concurrent transitions and rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - name: Run requests against a disposable database
        run: python3 scripts/test-agent-approval-postgres.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-approval-postgres
          path: test-results/agent-approval-postgres.log
          if-no-files-found: ignore
          retention-days: 7
